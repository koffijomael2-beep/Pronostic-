<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronostics</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{
  --pitch:#0D2B22; --turf:#14412F; --line:#2A5B47;
  --chalk:#F2EFE6; --muted:#8FB3A2; --card:#F7D117; --ink:#0D2B22;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--pitch);color:var(--chalk);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:16px 16px 110px;max-width:520px;margin:0 auto}
h1{font-size:30px;font-weight:800;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.fill{width:100%;margin:0 0 16px;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--turf);color:var(--chalk);font:inherit;font-weight:700;cursor:pointer}
.fill:active{background:var(--line)}
.match{background:var(--turf);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px}
.choices{display:grid;grid-template-columns:1fr 76px 1fr;gap:8px}
.opt{min-height:60px;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--pitch);
  color:var(--chalk);font:inherit;font-size:16px;font-weight:700;line-height:1.15;cursor:pointer}
.opt small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:2px}
.opt.on{background:var(--card);border-color:var(--card);color:var(--ink)}
.opt.on small{color:var(--ink)}
.opt:disabled{cursor:default}
.opt:focus-visible,.send:focus-visible,.use:focus-visible,.fill:focus-visible{outline:3px solid var(--card);outline-offset:2px}
.sugg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;
  padding:10px 12px;border:1px dashed var(--line);border-radius:12px;font-size:14px;color:var(--muted)}
.sugg b{color:var(--card);font-size:16px}
.use{flex:none;border:1px solid var(--card);background:transparent;color:var(--card);border-radius:999px;
  padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
.use:active{background:var(--card);color:var(--ink)}
.state{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px}
.state b{color:var(--card);font-weight:700}
.match.locked{opacity:.75}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--pitch) 70%,transparent)}
.send{display:block;width:100%;max-width:520px;margin:0 auto;border:0;border-radius:14px;padding:16px;
  background:var(--card);color:var(--ink);font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.send:disabled{background:var(--line);color:var(--muted);cursor:default}
.rules{color:var(--muted);font-size:13px;margin:18px 2px 0}
</style>
</head>
<body>
<h1>Mes pronostics</h1>
<p class="sub" id="count"></p>
<button class="fill" id="fill" type="button">Remplir avec les suggestions</button>
<main id="list"></main>
<p class="rules">Pour chaque match, choisis la victoire d’une équipe ou le match nul. Bon pronostic : 1 point. Les pronostics se verrouillent au coup d’envoi.</p>
<div class="bar"><button class="send" id="send" type="button"></button></div>

<script>
// ---- À MODIFIER : tes matchs (inH = heures avant/après maintenant, pour la démo) ----
// En production, remplace "inH" par une vraie date : kickoff: "2026-12-05T21:00:00+01:00"
// eloH / eloA = force de chaque équipe (valeurs approximatives à mettre à jour, par ex. depuis clubelo.com).
// Sans ces deux valeurs, aucune suggestion n’est affichée pour le match.
var MATCHES = [
  {id:1, home:"Paris", away:"Marseille", league:"Ligue 1", inH:-1, eloH:1880, eloA:1760},
  {id:2, home:"Lyon", away:"Monaco", league:"Ligue 1", inH:5, eloH:1740, eloA:1730},
  {id:3, home:"Lille", away:"Nice", league:"Ligue 1", inH:22, eloH:1720, eloA:1690},
  {id:4, home:"Real Madrid", away:"Barcelone", league:"Liga", inH:30, eloH:1990, eloA:1950},
  {id:5, home:"Arsenal", away:"Liverpool", league:"Premier League", inH:52, eloH:1940, eloA:1930}
];
var KEY = "pronostics_v2";           // "1" = victoire domicile, "N" = nul, "2" = victoire extérieur
var tg = window.Telegram && window.Telegram.WebApp;
var preds = {};

try { preds = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { preds = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(preds)); } catch (e) {} }

function kickoff(m){ return m.kickoff ? new Date(m.kickoff).getTime() : Date.now() + m.inH * 3600000; }
var T0 = {}; MATCHES.forEach(function(m){ T0[m.id] = kickoff(m); });
function locked(m){ return Date.now() >= T0[m.id]; }
function when(m){
  return new Date(T0[m.id]).toLocaleString("fr-FR", {weekday:"short", hour:"2-digit", minute:"2-digit"});
}
function byId(id){ return MATCHES.filter(function(x){ return x.id == id; })[0]; }
function label(m, v){ return v === "1" ? "victoire " + m.home : v === "2" ? "victoire " + m.away : "match nul"; }

// Suggestion : modèle de Poisson. Les forces donnent le nombre de buts attendus de chaque équipe,
// d’où les chances de victoire, de nul et de défaite. On suggère l’issue la plus probable.
function suggest(m){
  if (!m.eloH || !m.eloA) return null;
  var k = (m.eloH + 60 - m.eloA) / 400;            // 60 points d’avantage pour l’équipe à domicile
  var lh = 1.35 * Math.exp(0.6 * k), la = 1.35 * Math.exp(-0.6 * k);
  var ph = [], pa = [], f = 1, i, j;
  for (i = 0; i <= 8; i++) {
    if (i > 0) f *= i;
    ph.push(Math.exp(-lh) * Math.pow(lh, i) / f);
    pa.push(Math.exp(-la) * Math.pow(la, i) / f);
  }
  var w = 0, d = 0, l = 0;
  for (i = 0; i <= 8; i++) for (j = 0; j <= 8; j++) {
    var p = ph[i] * pa[j];
    if (i > j) w += p; else if (i === j) d += p; else l += p;
  }
  var t = w + d + l; w /= t; d /= t; l /= t;
  var pick = w >= d && w >= l ? "1" : l >= d ? "2" : "N";
  return {pick:pick, "1":w, "N":d, "2":l};
}
function pct(x){ return Math.round(x * 100) + " %"; }

function opt(m, v, text, sub, p, lk, extra){
  var on = p === v;
  return '<button class="opt' + (on ? ' on' : '') + '" type="button" data-id="' + m.id + '" data-v="' + v +
    '" aria-pressed="' + on + '"' + (lk ? ' disabled' : '') + '>' +
    (sub ? '<small>' + sub + '</small>' : '') + text + '</button>';
}
function suggHtml(m, lk){
  var s = suggest(m);
  if (lk || !s) return "";
  return '<div class="sugg"><span>Suggestion : <b>' + label(m, s.pick) + '</b><br>' +
    m.home + ' ' + pct(s["1"]) + ', nul ' + pct(s.N) + ', ' + m.away + ' ' + pct(s["2"]) + '</span>' +
    '<button class="use" type="button" data-id="' + m.id + '">Utiliser</button></div>';
}
function status(m, p, lk){
  if (lk) return p ? "Match commencé. Ton pronostic : <b>" + label(m, p) + "</b>" : "Match commencé. Pas de pronostic.";
  return p ? "Pronostic enregistré : <b>" + label(m, p) + "</b>" : "Choisis ton pronostic";
}

function render(){
  var list = document.getElementById("list");
  list.innerHTML = "";
  MATCHES.forEach(function(m){
    var p = preds[m.id], lk = locked(m);
    var el = document.createElement("section");
    el.className = "match" + (lk ? " locked" : "");
    el.setAttribute("aria-label", m.home + " contre " + m.away);
    el.innerHTML =
      '<div class="meta"><span>' + m.league + '</span><span>' + when(m) + '</span></div>' +
      '<div class="choices" role="group" aria-label="Ton pronostic">' +
        opt(m, "1", m.home, "Victoire", p, lk) +
        opt(m, "N", "Nul", "", p, lk) +
        opt(m, "2", m.away, "Victoire", p, lk) +
      '</div>' +
      suggHtml(m, lk) +
      '<div class="state" aria-live="polite">' + status(m, p, lk) + '</div>';
    list.appendChild(el);
  });
  var n = Object.keys(preds).length;
  document.getElementById("count").textContent = n + " sur " + MATCHES.length + " matchs pronostiqués";
  var btn = document.getElementById("send");
  btn.disabled = n === 0;
  btn.textContent = n === 0 ? "Choisis un pronostic pour commencer" : "Envoyer mes pronostics (" + n + ")";
}

document.getElementById("list").addEventListener("click", function(e){
  var b = e.target.closest(".opt") || e.target.closest(".use");
  if (!b) return;
  var m = byId(b.dataset.id);
  if (!m || locked(m)) return;
  if (b.classList.contains("use")) { var s = suggest(m); if (!s) return; preds[m.id] = s.pick; }
  else { preds[m.id] = b.dataset.v; }
  save(); render();
  if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch (err) {} }
});
document.getElementById("fill").addEventListener("click", function(){
  var changed = false;
  MATCHES.forEach(function(m){
    var s = suggest(m);
    if (s && !preds[m.id] && !locked(m)) { preds[m.id] = s.pick; changed = true; }
  });
  if (changed) { save(); render(); }
});
document.getElementById("send").addEventListener("click", function(){
  var payload = JSON.stringify({type:"pronostics", picks: Object.keys(preds).map(function(id){
    return {match:+id, pick:preds[id]};
  })});
  if (tg && tg.initData) { tg.sendData(payload); }
  else { document.getElementById("count").textContent = "Ouvre l’app depuis Telegram pour envoyer tes pronostics."; }
});

if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#0D2B22"); tg.setBackgroundColor("#0D2B22"); } catch (e) {} }
render();
setInterval(render, 60000);
</script>
</body>
</html>
